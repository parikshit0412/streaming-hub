events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        location / {
            proxy_pass http://host-app:80/;
            proxy_set_header Host $host;
        }

        location /browse {
            rewrite ^/browse(.*)$ /$1 break;
            proxy_pass http://browse-app:80/;
            proxy_set_header Host $host;
        }

        location /settings {
            rewrite ^/settings(.*)$ /$1 break;
            proxy_pass http://settings-app:80/;
            proxy_set_header Host $host;
        }

        location /watchlist {
            rewrite ^/watchlist(.*)$ /$1 break;
            proxy_pass http://watchlist-app:80/;
            proxy_set_header Host $host;
        }

        location /_next/ {
            proxy_pass http://watchlist-app:80/_next/;
            proxy_set_header Host $host;
        }

        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
